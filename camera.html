<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cameraworks</title>
    <link rel="stylesheet" href="css/style.css">
    <audio id="shutter-audio" src="images/icons/shutter-sound.mp3" preload="auto"></audio>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet"></head> 

<body class="camera-page">
    <header class="camera-header" id="camera-header">
        <img src="images/icons/camera.png" id="camera" alt="Camera">
        <h1>My Camera</h1>
        <div class="container">
            <div class="column">
                <p>Everything by a Canon EOS digital camera.</p>
                <p>Explore my photos and videos!</p>
            </div>
            <div class="button-container">
                <button onclick="location.href='index.html'">Home</button>
                <button onclick="location.href='projects.html'">Projects</button>
                <div class="dropdown">
                    <span class="dropdown-trigger">Personal</span>
                    <div class="dropdown-content">
                        <l><a href="writing.html" style="color: black;">Writing</a></l>
                        <l><a href="camera.html" style="color: black;">Camera</a></l>
                        <l><a href="scrapbook.html" style="color: black;">Scrapbook</a></l>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="camera-experience">
        <section class="map-stage" id="map-stage">
            <div id="map"></div>
            <p class="map-hint" id="map-hint">click on blue dots to explore my camera world.</p>
            <div id="drawer-container" class="photo-panel" aria-hidden="true">
                <button id="drawer-close" class="photo-panel-close" type="button" aria-label="Close photo panel">&times;</button>
                <div id="drawer-content"></div>
            </div>
        </section>
    </main>
    <script>
        window.addEventListener('load', function() {
            const audio = document.getElementById('shutter-audio');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(function() {});
            }
        });
    </script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js"></script>
    <script src="js/mapbox-config.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
